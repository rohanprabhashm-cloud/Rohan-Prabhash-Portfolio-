<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#18181B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3339" />
      <stop offset="45%" stop-color="#E62429" />
      <stop offset="85%" stop-color="#990B0F" />
      <stop offset="100%" stop-color="#550306" />
    </linearGradient>

    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="60%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="lensRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#E62429" opacity="0.18" />
    </pattern>

    <pattern id="carbonMesh" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" />
      <path d="M0 4 L4 0 L8 4 L4 8 Z" fill="#000000" opacity="0.15" />
    </pattern>

    <!-- Comic Glitch Filter -->
    <filter id="comicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>

    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#09090B" />
  <rect width="800" height="1000" fill="url(#bgGlow)" />
  <rect width="800" height="1000" fill="url(#halftone)" />

  <!-- Diagonal Comic Speed Lines -->
  <g stroke="#E62429" stroke-width="1.5" opacity="0.25">
    <line x1="-100" y1="100" x2="900" y2="400" stroke-dasharray="16 8" />
    <line x1="-100" y1="200" x2="900" y2="500" stroke-dasharray="24 12" />
    <line x1="-100" y1="350" x2="900" y2="650" stroke-dasharray="32 16" />
    <line x1="-100" y1="500" x2="900" y2="800" stroke-dasharray="20 10" />
    <line x1="100" y1="-100" x2="400" y2="900" stroke-dasharray="14 6" opacity="0.15" />
  </g>

  <!-- Spider Web Background Elements -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M 400 380 L 100 80" />
    <path d="M 400 380 L 700 80" />
    <path d="M 400 380 L 50 400" />
    <path d="M 400 380 L 750 400" />
    <path d="M 400 380 L 150 750" />
    <path d="M 400 380 L 650 750" />
    <!-- Web connecting curves -->
    <path d="M 220 200 Q 400 240 580 200" stroke-dasharray="6 4" />
    <path d="M 160 300 Q 400 340 640 300" stroke-dasharray="8 4" />
    <path d="M 180 440 Q 400 480 620 440" stroke-dasharray="6 4" />
    <path d="M 240 560 Q 400 600 560 560" stroke-dasharray="8 4" />
  </g>

  <!-- CHROMATIC OFFSET GLITCH SHADOW (Spider-Verse Aesthetic) -->
  <g transform="translate(6, 4)" opacity="0.4">
    <!-- Torso silhouette cyan glitch -->
    <path d="M 120 1000 C 140 820 220 740 330 710 L 400 700 L 470 710 C 580 740 660 820 680 1000 Z" fill="#00FFFF" opacity="0.3" />
    <!-- Head silhouette cyan glitch -->
    <path d="M 400 130 C 260 130 200 240 200 430 C 200 620 310 740 400 770 C 490 740 600 620 600 430 C 600 240 540 130 400 130 Z" fill="#00FFFF" opacity="0.25" />
  </g>

  <g transform="translate(-6, -4)" opacity="0.4">
    <!-- Torso silhouette red glitch -->
    <path d="M 120 1000 C 140 820 220 740 330 710 L 400 700 L 470 710 C 580 740 660 820 680 1000 Z" fill="#FF0055" opacity="0.3" />
    <!-- Head silhouette red glitch -->
    <path d="M 400 130 C 260 130 200 240 200 430 C 200 620 310 740 400 770 C 490 740 600 620 600 430 C 600 240 540 130 400 130 Z" fill="#FF0055" opacity="0.25" />
  </g>

  <!-- SHOULDERS & SUIT BODY -->
  <g>
    <!-- Dark suit shoulders -->
    <path d="M 80 1000 C 110 810 210 730 330 705 L 400 695 L 470 705 C 590 730 690 810 720 1000 Z" fill="url(#suitDark)" stroke="#000000" stroke-width="8" />
    
    <!-- Red Chest / Collar Inset -->
    <path d="M 250 1000 C 260 830 310 730 400 720 C 490 730 540 830 550 1000 Z" fill="url(#suitRed)" stroke="#000000" stroke-width="6" />
    <path d="M 250 1000 C 260 830 310 730 400 720 C 490 730 540 830 550 1000 Z" fill="url(#carbonMesh)" opacity="0.3" />

    <!-- Sharp Tech Collar Lines -->
    <path d="M 320 720 L 400 840 L 480 720" stroke="#000000" stroke-width="6" fill="none" />
    <path d="M 400 840 L 400 1000" stroke="#000000" stroke-width="6" />
    <path d="M 330 790 L 220 890" stroke="#000000" stroke-width="5" />
    <path d="M 470 790 L 580 890" stroke="#000000" stroke-width="5" />
    <path d="M 360 890 L 260 990" stroke="#000000" stroke-width="5" />
    <path d="M 440 890 L 540 990" stroke="#000000" stroke-width="5" />

    <!-- Spider Suit Emblem On Chest -->
    <g transform="translate(400, 800)" filter="url(#comicShadow)">
      <circle cx="0" cy="0" r="14" fill="#000000" />
      <ellipse cx="0" cy="-6" rx="8" ry="10" fill="#000000" />
      <!-- Upper legs -->
      <path d="M -5 -8 Q -30 -35 -50 -20" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 5 -8 Q 30 -35 50 -20" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M -6 -4 Q -45 -18 -65 10" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 6 -4 Q 45 -18 65 10" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Lower legs -->
      <path d="M -6 6 Q -45 15 -55 55" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 6 6 Q 45 15 55 55" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M -4 10 Q -25 35 -35 75" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 4 10 Q 25 35 35 75" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- NECK -->
  <path d="M 320 620 L 320 730 L 480 730 L 480 620 Z" fill="url(#suitRed)" stroke="#000000" stroke-width="6" />
  <path d="M 320 620 L 320 730 L 480 730 L 480 620 Z" fill="url(#carbonMesh)" opacity="0.3" />
  <line x1="360" y1="640" x2="360" y2="730" stroke="#000000" stroke-width="4" />
  <line x1="400" y1="640" x2="400" y2="730" stroke="#000000" stroke-width="4" />
  <line x1="440" y1="640" x2="440" y2="730" stroke="#000000" stroke-width="4" />

  <!-- HEAD & MASK SILHOUETTE -->
  <g>
    <!-- Deep outline drop shadow -->
    <path d="M 400 120 C 250 120 180 240 180 430 C 180 620 300 740 400 770 C 500 740 620 620 620 430 C 620 240 550 120 400 120 Z" fill="#000000" />
    
    <!-- Base Red Mask with Gradient -->
    <path d="M 400 125 C 255 125 188 245 188 430 C 188 615 305 730 400 760 C 495 730 612 615 612 430 C 612 245 545 125 400 125 Z" fill="url(#suitRed)" stroke="#000000" stroke-width="8" />

    <!-- Carbon weave overlay on mask -->
    <path d="M 400 125 C 255 125 188 245 188 430 C 188 615 305 730 400 760 C 495 730 612 615 612 430 C 612 245 545 125 400 125 Z" fill="url(#carbonMesh)" opacity="0.25" />

    <!-- Shading & Comic Highlights on Cranium and Jaw -->
    <!-- Top-left lighting highlight -->
    <path d="M 400 135 C 310 135 240 190 220 320 C 210 260 270 170 380 140 Z" fill="#FFFFFF" opacity="0.3" />
    <!-- Deep Right Jaw Comic Shadow -->
    <path d="M 605 420 C 600 580 500 700 400 750 C 470 710 560 610 575 450 Z" fill="#000000" opacity="0.45" />

    <!-- ==============================================
         DETAILED WEBBING NETWORK ON MASK
         ============================================== -->
    <!-- Center Origin at Nose Ridge (x: 400, y: 400) -->
    <!-- Vertical meridian -->
    <path d="M 400 125 L 400 760" stroke="#000000" stroke-width="4.5" />

    <!-- Radial Web Lines diverging from nose bridge -->
    <path d="M 400 390 L 400 125" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 330 140" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 470 140" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 260 180" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 540 180" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 210 250" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 590 250" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 190 350" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 610 350" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 190 460" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 610 460" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 220 570" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 580 570" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 280 670" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 520 670" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 340 730" stroke="#000000" stroke-width="4" />
    <path d="M 400 390 L 460 730" stroke="#000000" stroke-width="4" />

    <!-- Concentric Web Arcs (Upper Forehead) -->
    <path d="M 370 330 Q 400 320 430 330" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 330 270 Q 400 240 470 270" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 290 210 Q 400 170 510 210" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 255 160 Q 400 115 545 160" stroke="#000000" stroke-width="3.5" fill="none" />

    <!-- Concentric Web Arcs (Sides of Cheeks) -->
    <path d="M 200 350 Q 220 375 235 410" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 600 350 Q 580 375 565 410" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 205 460 Q 235 470 260 480" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 595 460 Q 565 470 540 480" stroke="#000000" stroke-width="3.5" fill="none" />

    <!-- Concentric Web Arcs (Chin & Jaw) -->
    <path d="M 340 470 Q 400 495 460 470" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 300 540 Q 400 580 500 540" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 270 610 Q 400 660 530 610" stroke="#000000" stroke-width="3.5" fill="none" />
    <path d="M 310 680 Q 400 730 490 680" stroke="#000000" stroke-width="3.5" fill="none" />

    <!-- ==============================================
         SIGNATURE SPIDER-VERSE EXPRESSIVE EYES (LENSES)
         Aggressive black faceted frame, glowing reflective white/cyan glass
         ============================================== -->
    <!-- LEFT EYE (Viewer's Left) -->
    <g>
      <!-- Thick Comic Ink Border with Offset -->
      <path
        d="M 240 330 C 275 305 345 325 380 395 C 365 440 300 450 250 365 Z"
        fill="#000000"
        stroke="#000000"
        stroke-width="14"
        stroke-linejoin="round"
      />
      <!-- Eye frame outer bevel -->
      <path
        d="M 242 332 C 275 308 342 328 376 394 C 362 436 302 446 252 366 Z"
        fill="#111827"
        stroke="#1E293B"
        stroke-width="3"
      />
      <!-- Glowing Lens Surface -->
      <path
        d="M 252 340 C 280 322 334 336 364 390 C 352 424 306 430 262 366 Z"
        fill="url(#lensGlow)"
        filter="url(#eyeGlow)"
      />
      <!-- Tech Grid & Reflex in Lens -->
      <path
        d="M 265 352 C 285 340 320 350 342 385 C 334 402 300 410 274 370 Z"
        fill="#FFFFFF"
        opacity="0.75"
      />
      <circle cx="285" cy="355" r="7" fill="#FFFFFF" />
      <!-- Cyan rim edge -->
      <path
        d="M 248 335 C 278 315 338 330 370 390"
        stroke="url(#lensRim)"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
      />
    </g>

    <!-- RIGHT EYE (Viewer's Right) -->
    <g>
      <!-- Thick Comic Ink Border with Offset -->
      <path
        d="M 560 330 C 525 305 455 325 420 395 C 435 440 500 450 550 365 Z"
        fill="#000000"
        stroke="#000000"
        stroke-width="14"
        stroke-linejoin="round"
      />
      <!-- Eye frame outer bevel -->
      <path
        d="M 558 332 C 525 308 458 328 424 394 C 438 436 498 446 548 366 Z"
        fill="#111827"
        stroke="#1E293B"
        stroke-width="3"
      />
      <!-- Glowing Lens Surface -->
      <path
        d="M 548 340 C 520 322 466 336 436 390 C 448 424 494 430 538 366 Z"
        fill="url(#lensGlow)"
        filter="url(#eyeGlow)"
      />
      <!-- Tech Grid & Reflex in Lens -->
      <path
        d="M 535 352 C 515 340 480 350 458 385 C 466 402 500 410 526 370 Z"
        fill="#FFFFFF"
        opacity="0.75"
      />
      <circle cx="515" cy="355" r="7" fill="#FFFFFF" />
      <!-- Cyan rim edge -->
      <path
        d="M 552 335 C 522 315 462 330 430 390"
        stroke="url(#lensRim)"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
      />
    </g>
  </g>

  <!-- FOREGROUND SPIDER-VERSE HALPTONE & VIGNETTE BORDER -->
  <rect x="0" y="0" width="800" height="1000" fill="none" stroke="#000000" stroke-width="16" />

  <!-- Corner Comic Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="32" fill="#E62429" stroke="#000000" stroke-width="3" transform="skewX(-12)" />
    <text x="18" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="2">SPIDER-VERSE</text>
  </g>

  <g transform="translate(620, 930)">
    <rect x="-10" y="0" width="150" height="28" fill="#000000" stroke="#E62429" stroke-width="2" transform="skewX(-12)" />
    <text x="5" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#E62429" letter-spacing="2">OPERATIVE #1</text>
  </g>
</svg>
